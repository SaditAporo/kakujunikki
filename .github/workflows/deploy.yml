name: Build and Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Flutter SDKのセットアップ
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          channel: 'stable'
          cache: true

      # 2. 依存関係の取得とWebビルド
      - run: flutter pub get
      - run: flutter build web --release

      # 3. Vercelへデプロイ (※Vercelのトークン設定が必要ですが、もっと簡単な方法もあります)